<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Evo TD – Tiere gegen Roboter</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <header id="hud">
      <div class="hud-group">
        <span class="hud-item">🗺 <strong id="hud-map">–</strong></span>
        <span class="hud-item">💰 <strong id="hud-gold">0</strong></span>
        <span class="hud-item">❤️ <strong id="hud-lives">0</strong></span>
        <span class="hud-item">Welle <strong id="hud-wave">–</strong></span>
        <span class="hud-item muted">nächste in <strong id="hud-countdown">0s</strong></span>
        <span class="hud-item">Einzeller: <strong id="hud-cost">0</strong> 💰</span>
        <span class="hud-item" title="Verlegungen">🚚 <strong id="hud-relocates">0</strong></span>
        <span class="hud-item" title="DNA (Globaler Shop)">🧬 <strong id="hud-dna">0</strong></span>
        <span class="hud-item hidden" id="hud-adapt" title="Roboter-Resistenzen (Roboterfabrik)"></span>
      </div>
      <div class="hud-group">
        <label class="hud-item toggle"><input type="checkbox" id="hud-autobuild" /> Auto-Bau</label>
        <button class="btn" id="hud-pause" title="Pause">⏸</button>
        <button class="btn" data-speed="1">1×</button>
        <button class="btn" data-speed="2">2×</button>
        <button class="btn" data-speed="4">4×</button>
        <button class="btn danger" id="hud-reset" title="Run abbrechen ohne DNA">Abbrechen</button>
      </div>
    </header>

    <main id="layout">
      <section id="board">
        <canvas id="game-canvas"></canvas>
        <div id="mode-hint" class="hidden"></div>
        <div id="dev-panel" class="card hidden"></div>
        <div id="offline-report" class="hidden">
          <div class="card">
            <h2>❄️ Während du weg warst</h2>
            <div id="offline-body"></div>
            <div class="progress"><div id="offline-bar"></div></div>
            <div class="actions">
              <button class="btn" id="offline-skip">Rest überspringen</button>
              <button class="btn hidden" id="offline-ok">Weiter</button>
            </div>
          </div>
        </div>
        <div id="game-over" class="hidden">
          <h2>Die Roboter haben gewonnen.</h2>
          <p id="game-over-text"></p>
          <p id="game-over-dna"></p>
          <div class="actions">
            <button class="btn" id="game-over-restart">Neuer Run</button>
            <button class="btn" id="game-over-shop">Globaler Shop</button>
          </div>
        </div>
      </section>
      <aside id="sidebar">
        <nav id="tabs">
          <button class="tab active" data-tab="tower">Turm</button>
          <button class="tab" data-tab="shop">Shop</button>
          <button class="tab" data-tab="items">Items</button>
          <button class="tab" data-tab="tree">Stammbaum</button>
          <button class="tab" data-tab="global">Global</button>
          <button class="tab" data-tab="chambers">Kammern</button>
          <button class="tab" data-tab="compendium">Kompendium</button>
          <button class="tab" data-tab="log">Protokoll</button>
        </nav>
        <section data-panel="tower">
          <div id="tower-panel" class="card"></div>
        </section>
        <section data-panel="shop" class="hidden">
          <div id="shop-panel" class="card"></div>
        </section>
        <section data-panel="items" class="hidden">
          <div id="items-panel" class="card"></div>
        </section>
        <section data-panel="tree" class="hidden">
          <div id="tree-view" class="card"></div>
          <div id="element-legend" class="card"></div>
        </section>
        <section data-panel="global" class="hidden">
          <div id="global-panel" class="card"></div>
        </section>
        <section data-panel="chambers" class="hidden">
          <div id="chambers-panel" class="card"></div>
        </section>
        <section data-panel="compendium" class="hidden">
          <div id="compendium-panel" class="card"></div>
        </section>
        <section data-panel="log" class="hidden">
          <div class="card">
            <h2>Protokoll</h2>
            <ul id="event-log"></ul>
          </div>
        </section>
      </aside>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
